<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GearShift Vehicle Service</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: #0f172a;">

    <!-- Minimal Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">⚙️</div>
                <div>Gear<span class="accent">Shift</span></div>
            </a>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline btn-sm">Sign In Instead</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 540px;">
            <div class="auth-header">
                <h2>Join GearShift</h2>
                <p>Register your vehicle and experience seamless automotive care</p>
            </div>

            <div class="auth-body">
                <form id="register-form" onsubmit="handleRegisterForm(event)" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="reg-name" name="name" class="form-control" placeholder="e.g. Alex Johnson" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
                            <input type="email" id="reg-email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="reg-phone">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="reg-phone" name="phone" class="form-control" placeholder="+1 (555) 000-0000" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
                            <input type="password" id="reg-password" name="password" class="form-control" placeholder="Min 6 characters" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="reg-confirm">Confirm Password <span class="required">*</span></label>
                            <input type="password" id="reg-confirm" name="confirm_password" class="form-control" placeholder="Repeat password" required>
                        </div>
                    </div>

                    <div style="margin-bottom:1.5rem; font-size:0.85rem; color:var(--text-muted);">
                        By creating an account, you agree to our Terms of Automotive Service and Privacy Policy.
                    </div>

                    <button type="submit" class="btn btn-accent btn-block btn-lg">
                        Create Account
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Already registered? <a href="login.html" style="font-weight:600;">Sign in here</a>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            redirectIfLoggedIn();
        });
    </script>
</body>
</html>
