<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | GearShift Vehicle Service</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: #0f172a;">

    <!-- Minimal Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">⚙️</div>
                <div>Gear<span class="accent">Shift</span></div>
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-outline btn-sm">&larr; Back to Home</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your vehicle service portal</p>
            </div>

            <div class="auth-body">
                <!-- 1-Click Demo Quick Fill Buttons -->
                <div style="background:#f1f5f9; padding:0.85rem; border-radius:0.5rem; margin-bottom:1.5rem; border:1px solid #e2e8f0;">
                    <div style="font-size:0.8rem; font-weight:700; color:#475569; text-transform:uppercase; margin-bottom:0.5rem;">
                        ⚡ Quick Demo Logins:
                    </div>
                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                        <button type="button" class="btn btn-outline-dark btn-sm" style="flex:1; font-size:0.82rem;" onclick="fillDemo('customer')">
                            👤 Demo Customer
                        </button>
                        <button type="button" class="btn btn-outline-dark btn-sm" style="flex:1; font-size:0.82rem; color:var(--accent); border-color:#fdba74;" onclick="fillDemo('admin')">
                            🔒 Demo Admin
                        </button>
                    </div>
                </div>

                <form id="login-form" onsubmit="handleLoginForm(event)" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
                        <input type="email" id="login-email" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                            <label class="form-label" for="login-password" style="margin:0;">Password <span class="required">*</span></label>
                        </div>
                        <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
                        Sign In
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html" style="font-weight:600;">Create an account</a>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            redirectIfLoggedIn();
        });

        function fillDemo(role) {
            const emailInput = document.getElementById('login-email');
            const passInput = document.getElementById('login-password');
            if (role === 'admin') {
                emailInput.value = 'admin@gearshift.com';
                passInput.value = 'Admin@123';
            } else {
                emailInput.value = 'john@example.com';
                passInput.value = 'Password@123';
            }
        }
    </script>
</body>
</html>
